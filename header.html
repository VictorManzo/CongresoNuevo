<!DOCTYPE html>
  <html lang="es">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Header Tecnología</title>
<style>
  :root {
    --bg: #0b0e14;
    --bg-alt: #11151f;
    --accent: #5b8cff;
    --accent-glow: rgba(91, 140, 255, 0.35);
    --text: #eaf0ff;
          --text-dim: #9aa5b8;
    --border: rgba(255,255,255,0.08);
}

  * { box-sizing: border-box; }

  body {
        margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
}

  header {
        position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(11, 14, 20, 0.85);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
}

  .nav-container {
        max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
}

  .logo {
        display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--text);
    text-decoration: none;
    letter-spacing: -0.5px;
}

  .logo-icon {
        width: 34px;
    height: 34px;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), #8a5bff);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 20px var(--accent-glow);
}

  .logo-icon svg {
        width: 18px;
    height: 18px;
    fill: white;
}

  .logo span {
        background: linear-gradient(90deg, #ffffff, var(--text-dim));
              -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  nav ul {
        display: flex;
    list-style: none;
    gap: 32px;
    margin: 0;
    padding: 0;
  }

  nav a {
        color: var(--text-dim);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 500;
    transition: color 0.2s ease;
    position: relative;
  }

  nav a:hover {
        color: var(--text);
  }

  nav a::after {
        content: '';
              position: absolute;
    left: 0;
    bottom: -6px;
    width: 0;
    height: 2px;
    background: var(--accent);
    transition: width 0.25s ease;
  }

  nav a:hover::after {
        width: 100%;
}

  .nav-actions {
        display: flex;
    align-items: center;
    gap: 14px;
}

  .btn-outline {
        padding: 9px 18px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease;
}

  .btn-outline:hover {
        border-color: var(--accent);
    background: rgba(91,140,255,0.08);
}

  .btn-solid {
        padding: 10px 20px;
    border-radius: 8px;
    border: none;
    background: linear-gradient(135deg, var(--accent), #7b5bff);
    color: white;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 18px var(--accent-glow);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
}

  .btn-solid:hover {
        transform: translateY(-1px);
    box-shadow: 0 6px 24px var(--accent-glow);
  }

  .menu-toggle {
        display: none;
    flex-direction: column;
          gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px;
}

  .menu-toggle span {
        width: 24px;
    height: 2px;
    background: var(--text);
    border-radius: 2px;
    transition: all 0.25s ease;
}

  .menu-toggle.active span:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
  }
  .menu-toggle.active span:nth-child(2) {
    opacity: 0;
}
  .menu-toggle.active span:nth-child(3) {
        transform: translateY(-7px) rotate(-45deg);
  }

  .demo-content {
        max-width: 1200px;
        margin: 0 auto;
    padding: 80px 24px;
    text-align: center;
}

  .demo-content h1 {
    font-size: 2.5rem;
    margin-bottom: 12px;
}

  .demo-content p {
        color: var(--text-dim);
}

  @media (max-width: 860px) {
    nav ul {
            position: fixed;
      top: 68px;
      left: 0;
      right: 0;
      flex-direction: column;
      background: var(--bg-alt);
      border-bottom: 1px solid var(--border);
      padding: 20px 24px;
      gap: 18px;
      transform: translateY(-150%);
      opacity: 0;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }

    nav ul.open {
            transform: translateY(0);
      opacity: 1;
    }

    .nav-actions .btn-outline {
            display: none;
  }

    .menu-toggle {
            display: flex;
}
      }
</style>
      </head>
      <body>

      <header>
        <div class="nav-container">
          <a href="#" class="logo">
            <span class="logo-icon">
              <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </span>
            <span>NEXORA</span>
          </a>

          <nav>
            <ul id="navList">
              <li><a href="#">Inicio</a></li>
              <li><a href="#">Productos</a></li>
              <li><a href="#">Soluciones</a></li>
              <li><a href="#">Precios</a></li>
              <li><a href="#">Blog</a></li>
              <li><a href="#">Contacto</a></li>
            </ul>
          </nav>

          <div class="nav-actions">
            <button class="btn-outline">Iniciar sesión</button>
      <button class="btn-solid">Empezar ahora</button>
      <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
              <span></span><span></span><span></span>
            </button>
          </div>
        </div>
      </header>

      <div class="demo-content">
        <h1>Header listo para tu web de tecnología</h1>
        <p>Redimensiona la ventana o ábrelo en móvil para ver el menú responsive.</p>
</div>

<script>
  const toggle = document.getElementById('menuToggle');
  const navList = document.getElementById('navList');
  toggle.addEventListener('click', () => {
        toggle.classList.toggle('active');
    navList.classList.toggle('open');
});
</script>

  </body>
  </html>
